<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .box1 {
            position: relative;
            margin: 50px auto;
            width: 800px;
            height: 500px;
            background: silver;
        }
        .box2 {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 150px;
            height: 150px;
            border-radius: 20px; /* that use to curve the corner and if the element of width & height equal to the border-radius, the element to be the circle */
            background: linear-gradient(-45deg, teal, purple);
            transition: scale 0.5s;/* When the pointer touch the element(hover),the expand of the element is to be slow and smooth */
            animation: move 3s infinite alternate;
        }
        .box2:hover {
            scale: 1.2;
        }
        @keyframes move {
            0% { top: 0; left: 0; }
            50% { top: 350px; left: 320px; }
            100% { top: 0; left: 650px; }
        }
        
    </style>
</head>
<body>
    <div class="box1">
            <div class="box2"></div>
    </div>
</body>
</html>
