<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Same Property & Variable -> {name: name, age: age}</title>
</head>
<body>
    <script>
        let name = "Alcie";
        let age = 23;

     // let alice = { name: name, age: age };
        let alice = { name, age }; // can be written short like this // property shorthand
     // output -> alice     

    </script>
</body>
</html>
