<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dot-dot-dot operator array spread</title>
</head>
<body>
    <script>
        let num1 = [1, 2];
        let num2 = [3, 4];
        let num3 = [num1, num2];
     // output -> num3
        
        let num4 = [...num1, ...num2];
     // output -> num4
    </script>
</body>
</html>
