<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    div#box>h3.title+ul>li*3>a[href=#]{Item $} 
    /* [] is to put attribute and {} is to put content */
    <div id="box">
        <h3 class="title"></h3>
        <ul>
            <li><a href="#">Item 1</a></li>
            <li><a href="#">Item 2</a></li>
            <li><a href="#">Item 3</a></li>
        </ul>
    </div>

</body>
</html>
