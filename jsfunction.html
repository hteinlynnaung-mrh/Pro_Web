<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS function</title>
</head>
<body>
    <script>
        function add(a, b) { /* function statement, function name, parameter */
            return a + b;
        }

        let sum = function(a, b) { /* add the function to the sum variable / nameless function, anonymus function */
            return a + b;
        }

        let sub = (a, b) => { /* arrow function */
            return  a - b;
        }

        let twice = n => n * 2; /* if we have only one parameter,we don't need to add () */
        /* if the only one statement, we don't need to add {} and return */


    </script>
</body>
</html>
