<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous" defer>
    </script>
</head>
<body>
    <div class="container-fluid">
        <div class="row g-0" style="min-height: 2000px">
            <!-- g-0 is used to remove gap between 2-columns (second column & navbar) -->
            <div class="col-3 col-lg-2 bg-light">
                <h1 class="h3 text-center py-2 text-primary">
                    <i class="fa-solid fa-ghost"></i>
                    <span class="ms-2 d-none d-lg-inline">App</span>
    <!-- When the screen size is small,if we don't want to show the icon,we use d-none d=display -->
    <!-- When the screen size is big,if we want to show the icon,we use d-lg-inline -->
                </h1>
                <ul class="list-group me-2 text-center text-lg-start">
                    <li class="list-group-item active">
                        <i class="fa-solid fa-home"></i> 
                        <span class="ms-2 d-none d-lg-inline">Home</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-users"></i> 
                        <span class="ms-2 d-none d-lg-inline">Users</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-flag"></i> 
                        <span class="ms-2 d-none d-lg-inline">Issues</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-cog"></i> 
                        <span class="ms-2 d-none d-lg-inline">Settings</span>
                    </li>
                </ul>

                <ul class="list-group me-2 mt-4 text-center text-lg-start">
                    <li class="list-group-item">
                        <i class="fa-solid fa-home"></i> 
                        <span class="ms-2 d-none d-lg-inline">Home</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-users"></i> 
                        <span class="ms-2 d-none d-lg-inline">Users</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-flag"></i> 
                        <span class="ms-2 d-none d-lg-inline">Issues</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-cog"></i> 
                        <span class="ms-2 d-none d-lg-inline">Settings</span>
                    </li>
                </ul>
            </div>

            <div class="col-9 col-lg-10 bg-warning">
                <nav class="navbar bg-light navbar-expand">
                    <div class="container-fluid">
                        <ul></ul>
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a href="#" class="nav-link">
                                    <i class="fa-solid fa-cog"></i>
                                </a>
                            </li>
                            <li class="nav-item dropdown">
                                <a href="#" class="nav-link dropdown-toggle"
                                    data-bs-toggle="dropdown">
                                    <i class="fa-solid fa-user-circle"></i>
                                </a>
                                <div class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                                    <a href="#" class="dropdown-item">
                                        <i class="fa-solid fa-user me-2"></i>
                                        Profile
                                    </a>
                                    <a href="#" class="dropdown-item">
                                        <i class="fa-solid fa-sign-out me-2"></i>
                                        Logout
                                    </a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>

                <div class="p-3">
                    <div class="alert alert-info">
                        <i class="fa-solid fa-download me-3"></i>
                            A new version avaialble
                    </div>

                    <!-- div.row>div.col.mb-3*4>div.bg-light.p-4 -->
                    <div class="row flex-column flex-lg-row"> <!-- responsive-flex feature -->
                        <div class="col mb-3">
                            <div class="bg-light p-4">
                                <h5>Daily Users</h5>
                                <span class="text-success">
                                    <i class="fa-solid fa-chart-line me-2"></i>
                                    2,710
                                </span>
                            </div>
                        </div>
                        <div class="col mb-3">
                            <div class="bg-light p-4">
                                <h5>Weekly Users</h5>
                                <span class="text-success">
                                    <i class="fa-solid fa-chart-line me-2"></i>
                                    27,011
                                </span>
                            </div>
                        </div>
                        <div class="col mb-3">
                            <div class="bg-light p-4">
                                <h5>Monthly Users</h5>
                                <span class="text-success">
                                    <i class="fa-solid fa-chart-line me-2"></i>
                                    270,280
                                </span>
                            </div>
                        </div>
                        <div class="col mb-3">
                            <div class="bg-light p-4">
                                <h5>Yearly Users</h5>
                                <span class="text-success">
                                    <i class="fa-solid fa-chart-line me-2"></i>
                                    2,701,807
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
