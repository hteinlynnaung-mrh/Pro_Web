<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <header class="col bg-info" style="height: 100px"></header>
        </div>
        <div class="row">
            <nav class="col-12 col-md-12 col-lg-3 bg-warning" style="height: 300px"></nav>
            <article class="col-12 col-md-6 col-lg-6 bg-primary" style="height: 300px">
            </article>
            <aside class="col-12 col-md-6 col-lg-3 bg-danger" style="height: 300px"></aside>
        </div>
        <div class="row">
            <footer class="col bg-secondary" style="height: 50px"></footer>
        </div>
    </div>
</body>

</html>
