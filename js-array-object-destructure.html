<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array destructure & Object destructure</title>
</head>
<body>
    <script>
        let arr = [11, 22, 33];
        let [a, b] = arr;
     // output -> a / b

        let obj = {name: 'Bob', age: 23};
        let { name, age } = obj;
     // output -> name / age

    </script>
</body>
</html>
